[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts"
version = "0.1.0"
description = "Faceless Shorts Generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx[http2]>=0.27.0",
    "tenacity>=8.0.0",
    "gradio>=4.0.0",
    "pyyaml>=6.0.0",
    "aiolimiter>=1.1.0",
    "jinja2>=3.1.0",
    "edge-tts>=6.1.10",
    "gtts>=2.5.0",
    "imagehash>=4.3.1",
    "pillow>=10.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]
local-tts = ["kokoro-onnx>=0.1.0", "piper-tts>=1.2.0"]
whisper = ["faster-whisper>=1.0.0"]

[project.scripts]
shorts = "shorts.cli:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "S", "B", "A", "C4", "T10", "T20", "RET", "SIM", "ARG", "PTH", "RUF"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
